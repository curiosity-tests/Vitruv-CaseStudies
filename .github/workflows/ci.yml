name: CI
run-name: "CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

# workflow triggers
on:
  # manually
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  # PRs on `main`
  pull_request:
    branches:
    - main
  # nightly
  schedule:
    - cron: "0 4 * * *"


env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  verify:
    name: Verify build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        exclude:
          - os: windows-latest # TODO: Windows builds currently fail as documented in https://github.com/vitruv-tools/Vitruv-CaseStudies/issues/241

    steps:
    - name: Support Longpaths [Windows]
      if: matrix.os == 'windows-latest'
      run: git config --system core.longpaths true

    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Setup Java and Maven cache
      uses: actions/setup-java@v6.0.0
      with:
        distribution: 'temurin'
        java-version: '21'
        check-latest: true
        cache: 'maven'

    - name: Verify build
      run: >
        ./mvnw clean verify
        --batch-mode
        --update-snapshots
        --no-transfer-progress
